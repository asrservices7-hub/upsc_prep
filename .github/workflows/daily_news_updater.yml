name: Daily UPSC News Updater

on:
  schedule:
    # Runs at 00:30 UTC every day (06:00 AM IST)
    - cron: '30 0 * * *'
  workflow_dispatch: # Allows manual triggering

jobs:
  update-news:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Need write permission to commit back to repo
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run News Updater Script (Static Generation)
        run: python generate_static_data.py

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Build Flutter Web
        run: flutter build web --release

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -f lib/data/static_data.dart
          git add -f build/web
          git commit -m "Automated Daily News & Content Update" || exit 0
          git push
