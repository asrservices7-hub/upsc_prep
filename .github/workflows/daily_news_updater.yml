name: Daily UPSC News Updater

on:
  schedule:
    # Runs at 00:30 UTC every day (06:00 AM IST)
    - cron: '30 0 * * *'
  workflow_dispatch: # Allows manual triggering

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests feedparser firebase-admin

      - name: Run News Updater Script
        run: python scripts/daily_news_updater.py
